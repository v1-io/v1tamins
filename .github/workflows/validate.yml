on: [push, pull_request]

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Check plugin packaging
        run: scripts/validate-plugin.sh
      - name: Test invocation policy and portability checks
        run: |
          ruby scripts/test-check-skill-metadata.rb
          ruby scripts/test-check-skill-assets.rb
          python3 scripts/test-check-shared-portability.py
      - name: Test shipped executable helpers offline
        run: |
          python3 scripts/test-peer-contract.py
          bash scripts/test-peer-run.sh
          python3 scripts/test-artifact-converters.py
          python3 scripts/test-with-server.py
      - name: Require a changeset for plugin content changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD" -- plugins/v1tamins/skills/)"
          if [ -n "$changed" ]; then
            echo "plugins/v1tamins/skills/ changed — a changeset is required:"
            npx changeset status --since="origin/$BASE_REF"
          else
            echo "No plugins/v1tamins/skills/ changes; changeset not required."
          fi
