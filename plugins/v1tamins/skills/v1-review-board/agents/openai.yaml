interface:
  display_name: "Review Board"
  short_description: "Propose a current OAuth-backed peer roster, wait for selection, then compile a read-only verified review ledger."
  default_prompt: "Use $v1-review-board to propose a current quality roster for this PR; wait for my selection and stop at the ledger."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - git_remote
    - peer_launch
