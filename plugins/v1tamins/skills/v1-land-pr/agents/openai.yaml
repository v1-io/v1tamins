interface:
  display_name: "Land PR"
  short_description: "Prepare, monitor, and ready a pull request without merging"
  default_prompt: "Use $v1-land-pr to take the completed branch through CI and review to a ready-to-review pull request without merging it."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - external_write
    - git_remote
