interface:
  display_name: "Land PR"
  short_description: "Commit, push, open, monitor, and ready a PR"
  default_prompt: "Use $v1-land-pr to turn the current working tree into a ready-to-review pull request."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - external_write
    - git_remote
