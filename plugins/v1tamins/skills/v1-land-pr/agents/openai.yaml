interface:
  display_name: "Land PR"
  short_description: "Open a draft PR or take it through review readiness"
  default_prompt: "Use $v1-land-pr to commit and push this branch, open or reuse a PR, and take it through CI to ready for review."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - external_write
    - git_remote
