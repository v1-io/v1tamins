interface:
  display_name: "Prove Work"
  short_description: "Record a demo GIF and attach it to a PR"
  default_prompt: "Use $v1-prove-work to record a demo of this change and package it for the PR."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - browser_capture
    - external_write
