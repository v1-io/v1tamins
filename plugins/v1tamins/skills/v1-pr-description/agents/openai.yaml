interface:
  display_name: "PR Description"
  short_description: "Write a visual-first PR title and body"
  default_prompt: "Use $v1-pr-description to draft a title, a short visual summary, before-and-after evidence, and merge danger for this PR."

policy:
  allow_implicit_invocation: true
  invocation_posture: selective_implicit
  side_effects:
    - external_write
