interface:
  display_name: "Goldpan"
  short_description: "Pan recent PRs and agent sessions for compound-worthy moments and queue them through /ce-compound"
  default_prompt: "Use $v1-goldpan 7d to pan the last week of work for compound-worthy moments."

policy:
  allow_implicit_invocation: false
  invocation_posture: explicit_only
  side_effects:
    - external_write
    - peer_launch
