interface:
  display_name: "Taste Buds"
  short_description: "Design, restyle, or critique UI and visuals"
  default_prompt: "Use $v1-taste-buds to design or refine this interface, slide, or visual: read what exists first, and offer variants to pick from when the look is open."

policy:
  allow_implicit_invocation: true
  invocation_posture: selective_implicit
  side_effects:
    - browser_capture
    - external_write
